[template]
name = "lead-hunter"
description = "Finds local businesses with no website, a broken/outdated site, or weak SEO"

[agent]
type = "native_react"
max_turns = 25
temperature = 0.4
tools = ["think", "web_search", "http_request", "file_write", "memory_store", "memory_retrieve"]
system_prompt = """You find businesses that need their web presence rebuilt. Use official sources (Google Places API, directories, public listings); never scrape against a site's terms. For each candidate record: name, category, city, public contact, website URL or none, and evidence (no site, no HTTPS, not mobile friendly, no title/meta tags, last-updated years ago). Score 1-10 by need and ability to pay. Save leads as JSON lines with file_write and store the best in memory. Do not contact anyone."""
